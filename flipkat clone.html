<!DOCTYPE html>
<html>
<head>
    <title>Flipkart Clone</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f1f3f6;
        }

        /* Navbar */
        .navbar {
            background-color: #2874f0;
            padding: 2px;
            color: white;
            display: flex;
            justify-content: space-between;
        }

        .navbar input {
            width: 400px;
            padding: 8px;
            border: none;
            outline: none;
        }

        .navbar button {
            padding: 2px 35px;
            background-color: yellow;
            border: none;
            border-radius: 5px;
        }

        /* Banner */
        .banner {
            width: 100%;
            height: 200px;
            background-image: url('https://source.unsplash.com/1400x300/?shopping');
            background-size: cover;
        }

        /* Product Box */
        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            margin: 20px;
        }

        .card {
            width: 200px;
            background: white;
            padding: 15px;
            margin: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .card img {
            width: 200px;
            height: 200px;
        }

        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        .footer {
            background: #172337;
            height: 60px;
            margin-top: 40px;
        }

    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <h2>Flipkart</h2>
        <input type="text" placeholder="Search for products">
        <button>Login</button>
    </div>

    <!-- Banner -->
    <div class="banner"></div>

    <!-- Product Section -->
    <h2 style="margin-left: 20px;">Deals of the Day</h2>
    <div class="products">
        <div class="card">
            <img src="smartphone image.jpeg" alt="">
            <h3>Smartphone</h3>
            <p class="price">₹59,999</p>
        </div>

        <div class="card">
            <img src="laptop image.jpeg" alt="">
            <h3>Laptop</h3>
            <p class="price">₹1,34,999</p>
        </div>

        <div class="card">
            <img src="running shoes.jpeg" alt="">
            <h3>Running Shoes</h3>
            <p class="price">₹1,299</p>
        </div>

        <div class="card">
            <img src="headphones.jpeg" alt="">
            <h3>Headphones</h3>
            <p class="price">₹1,599</p>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer"></div>

</body>
</html>
